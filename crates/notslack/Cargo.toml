[package]
name = "notslack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
app_model = { package = "notslack-app-model", path = "../app/model" }
chat = { package = "notslack-chat", path = "../chat" }
gpui.workspace = true
gpui_platform.workspace = true
media_capture = { package = "notslack-media-capture", path = "../media/capture" }
theme.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-channel.workspace = true
raw-window-handle = "0.6"
serde.workspace = true
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
